<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VisaGuard AT-ABRAY HK</title>
    <style>
        body { background:#121214; color:#e1e1e6; font-family:system-ui,sans-serif; margin:0; padding:0; }
        header { background:#1a1a1e; padding:15px 30px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #29292e; }
        .logo h1 { font-size:20px; margin:0; font-weight:bold; }
        .logo h1 span { font-size:11px; background:rgba(37,99,235,0.2); color:#60a5fa; padding:2px 6px; border-radius:4px; margin-left:8px; }
        .logo p { font-size:12px; color:#a1a1aa; margin:4px 0 0 0; }
        .badge { font-size:13px; background:#202024; padding:8px 16px; border-radius:8px; border:1px solid #29292e; }
        main { max-width:1200px; margin:0 auto; padding:30px 20px; }
        .widgets { display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:20px; margin-bottom:30px; }
        .widget { background:#1a1a1e; border:1px solid #29292e; border-radius:12px; padding:20px; }
        .widget.warn { border-color:rgba(245,158,11,0.4); }
        .widget.crit { border-color:rgba(239,68,68,0.4); }
        .widget p { font-size:13px; color:#a1a1aa; text-transform:uppercase; font-weight:600; margin:0; }
        .widget h3 { font-size:32px; font-weight:900; margin:10px 0 0 0; }
        .widget.warn h3 { color:#fbbf24; }
        .widget.crit h3 { color:#f87171; }
        .container { background:#1a1a1e; border:1px solid #29292e; border-radius:12px; overflow:hidden; }
        .head { padding:20px; border-bottom:1px solid #29292e; font-size:18px; font-weight:bold; }
        table { width:100%; border-collapse:collapse; text-align:left; }
        th { background:#202024; color:#a1a1aa; font-size:12px; text-transform:uppercase; padding:14px 20px; border-bottom:1px solid #29292e; }
        td { padding:14px 20px; font-size:14px; border-bottom:1px solid #202024; }
        tr.employee-row { background:#1a1a1e; cursor:pointer; }
        tr.employee-row:hover { background:#222226; }
        .name-wrapper { display:flex; align-items:center; gap:10px; font-weight:600; color:#fff; }
        .arrow-icon { color:#3b82f6; transition:transform 0.2s; display:inline-block; font-size:11px; }
        .pass { font-family:monospace; color:#a1a1aa; }
        tr.visa-row { display:none; background:#151518; }
        tr.visa-row td { border-bottom:1px solid #1a1a1e; color:#d1d1d6; }
        .status { display:inline-block; padding:4px 10px; font-size:11px; font-weight:bold; border-radius:20px; min-width:100px; text-align:center; }
        .st-act { background:rgba(16,185,129,0.15); color:#34d399; border:1px solid rgba(16,185,129,0.2); }
        .st-wrn { background:rgba(245,158,11,0.15); color:#fbbf24; border:1px solid rgba(245,158,11,0.2); }
        .st-crt { background:rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.2); }
        .alert-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
        .dot-crit { background:#f87171; box-shadow:0 0 8px #ef4444; }
        .dot-wrn { background:#fbbf24; box-shadow:0 0 8px #f59e0b; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><h1>VisaGuard <span>AT-ABRAY HK</span></h1><p>Групповой контроль визовых сроков (Кликабельный список)</p></div>
        <div class="badge">Администратор</div>
    </header>
    <main>
        <div class="widgets">
            <div class="widget"><p>Сотрудников в базе</p><h3 id="total-staff">0</h3></div>
            <div class="widget warn"><p>Визы истекают (&lt; 30 дней)</p><h3 id="warning-visas">0</h3></div>
            <div class="widget crit"><p>Просроченные визы</p><h3 id="critical-visas">0</h3></div>
        </div>
        <div class="container">
            <div class="head">Сводный статус документов (Нажмите на имя сотрудника)</div>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr><th>Сотрудник</th><th>Паспорт</th><th>Направление / Виза</th><th>Окончание срока</th><th>Дней до дедлайна</th><th style="text-align:center;">Статус</th></tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script>
        const staffData = [
            { id: 1, name: "AMANOV MAKSATMYRAT", passport: "A3619522", visas: [
                { country: "Turkmenistan (Zagran)", expDate: "2031-06-08" },
                { country: "Visa Russia", expDate: "2026-09-28" },
                { country: "Visa Kazakhstan", expDate: "2026-09-20" },
                { country: "Strahowka", expDate: "2055-04-12" }
            ]},
  	{ id: 2, name: "CHARYYEV DOVLETGELDI", passport: "A2233944", visas: [
                { country: "Turkmenistan (Zagran)", expDate: "2028-09-01" },
            	{ country: "Visa Russia", expDate: "2026-09-28" },
                { country: "Visa Kazakhstan", expDate: "2026-09-20" }
            ]},
{ id: 3, name: "CHARYYEV GURBANBERDI", passport: "A3692937", visas: [
                { country: "Turkmenistan (Zagran)", expDate: "2031-08-26" },
            	{ country: "Visa Russia", expDate: "2026-09-28" },
                { country: "Visa Kazakhstan", expDate: "2026-09-20" }
            ]},
{ id: 4, name: "DOVLETMAMMEDOV MERDAN", passport: "A2176210", visas: [
                { country: "Turkmenistan (Zagran)", expDate: "2028-07-16" },
            	{ country: "Visa Russia", expDate: "2026-09-28" },
                { country: "Visa Kazakhstan", expDate: "2026-09-20" }
            ]},
          { id: 5, name: "GURBANOV AZAT", passport: "A2905411", visas: [
                { country: "Turkmenistan (Zagran)", expDate: "2029-10-14" },
            	{ country: "Visa Russia", expDate: "2026-11-19" },
                { country: "Visa Kazakhstan", expDate: "2026-11-19" }
            ]},
                     { id: 6, name: "HALBAYEV MUHTAR", passport: "A2979026", visas: [
                { country: "Turkmenistan (Zagran)", expDate: "2029-11-24" },
            	{ country: "Visa Russia", expDate: "2026-12-17" },
                { country: "Visa Kazakhstan", expDate: "2026-12-17" }
            ]},
                                { id: 7, name: "HALBAYEV REJEPGELDI", passport: "A2662906", visas: [
                { country: "Turkmenistan (Zagran)", expDate: "2031-07-22" },
            	{ country: "Visa Russia", expDate: "2026-12-17" },
                { country: "Visa Kazakhstan", expDate: "2026-12-17" }
            ]},
                                     { id: 8, name: "MAMMETMYRADOV ALLABERDI", passport: "A2731217", visas: [
                { country: "Turkmenistan (Zagran)", expDate: "2029-07-23" },
            	{ country: "Visa Russia", expDate: "2026-12-17" },
                { country: "Visa Kazakhstan", expDate: "2026-12-17" }
                
            ]},
                            { id: 9, name: "MAMMETMYRADOV MUHAMMETNIYAZ", passport: "A1967222", visas: [
                { country: "Turkmenistan (Zagran)", expDate: "2027-10-20" },
            	{ country: "Visa Russia", expDate: "2026-09-28" },
                { country: "Visa Kazakhstan", expDate: "2026-09-20" }
            ]},
            { id: 10, name: "MUHAMMETGULYYEV SOHBET", passport: "A2866035", visas: [
                { country: "Turkmenistan (Zagran)", expDate: "2029-09-18" },
            	{ country: "Visa Russia", expDate: "2026-09-28" },
                { country: "Visa Kazakhstan", expDate: "2026-09-20" }
            ]},
                       { id: 11, name: "MUHAMMETGULYYEV YAKUP", passport: "A2114719", visas: [
                { country: "Turkmenistan (Zagran)", expDate: "2028-05-25" },
            	{ country: "Visa Russia", expDate: "2026-09-28" },
                { country: "Visa Kazakhstan", expDate: "2026-09-20" }
            ]},
        
        ];

        function renderDashboard() {
            const tbody = document.getElementById('table-body');
            const today = new Date();
            let warningVisas = 0, criticalVisas = 0;
            tbody.innerHTML = '';

            staffData.forEach(person => {
                let pCrit = 0, pWrn = 0, visasHTML = '';

                person.visas.forEach(visa => {
                    const expDate = new Date(visa.expDate);
                    const daysLeft = Math.ceil((expDate.getTime() - today.getTime()) / (1000 * 3600 * 24));
                    let txt = "Активна", cls = "st-act", daysText = daysLeft + " дней";

                    if (daysLeft < 0) {
                        txt = "Истекла"; cls = "st-crt";
                        daysText = "Просрочено на " + Math.abs(daysLeft) + " дн.";
                        criticalVisas++; pCrit++;
                    } else if (daysLeft <= 30) {
                        txt = "Истекает скоро"; cls = "st-wrn";
                        warningVisas++; pWrn++;
                    }

                    visasHTML += '<tr class="visa-row user-' + person.id + '"><td></td><td></td>' +
                                 '<td>• ' + visa.country + '</td><td>' + expDate.toLocaleDateString('ru-RU') + '</td>' +
                                 '<td style="font-family:monospace;">' + daysText + '</td>' +
                                 '<td style="text-align:center;"><span class="status ' + cls + '">' + txt + '</span></td></tr>';
                });

                const empTr = document.createElement('tr');
                empTr.className = 'employee-row';
                empTr.setAttribute('onclick', 'toggleVisas(' + person.id + ')');

                let dotHTML = '';
                if (pCrit > 0) dotHTML = '<span class="alert-dot dot-crit"></span>';
                else if (pWrn > 0) dotHTML = '<span class="alert-dot dot-wrn"></span>';

                empTr.innerHTML = '<td><div class="name-wrapper"><span class="arrow-icon" id="arrow-' + person.id + '">▶</span><span>' + person.name + '</span></div></td>' +
                                  '<td class="pass">' + person.passport + '</td>' +
                                  '<td style="color:#a1a1aa; font-style:italic;">Документов: ' + person.visas.length + ' шт.</td>' +
                                  '<td></td><td></td><td style="text-align:center;">' + dotHTML + '</td>';

                tbody.appendChild(empTr);
                tbody.insertAdjacentHTML('beforeend', visasHTML);
            });

            document.getElementById('total-staff').innerText = staffData.length;
            document.getElementById('warning-visas').innerText = warningVisas;
            document.getElementById('critical-visas').innerText = criticalVisas;
        }

        function toggleVisas(id) {
            document.querySelectorAll('.user-'+id).forEach(r => {
                let show = r.style.display === 'table-row';
                r.style.display = show ? 'none' : 'table-row';
                document.getElementById('arrow-'+id).style.transform = show ? 'rotate(0deg)' : 'rotate(90deg)';
            });
        }
        window.onload = renderDashboard;
    </script>
</body>
